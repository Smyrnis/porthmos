[workspace]
resolver = "3"
members = ["porthmos-*", "protocols/*"]
default-members = ["porthmos-gui"]

[workspace.package]
version = "2026.5.0-dev.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/Smyrnis/porthmos"

[workspace.dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
async-trait = "0.1"
similar = { version = "2", default-features = false, features = ["text"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
russh = "0.63.3"
russh-sftp = "3.0.0"
serde = { version = "1.0.229", features = ["derive"] }
roxmltree = "0.21"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
toml = "1.1.6"
toml_edit = "0.25"
rust-i18n = "4.2.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"
zeroize = "1.8"
keyring-core = "1.0"
libc = "0.2"
embed-manifest = "1.5.1"
iced = "0.14"
rfd = "0.17"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
raw-window-handle = "0.6"
rustix = { version = "1", default-features = false, features = ["fs", "pipe", "std"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
x11rb = "0.13"
x11-dl = "2"
drag = "2.1.1"
winresource = "0.1"
zip = { version = "8", default-features = false, features = ["deflate"] }
windows-sys = "0.61"
alacritty_terminal = "=0.26.0"
portable-pty = "0.9"
porthmos-vfs = { path = "porthmos-vfs" }
porthmos-lfs = { path = "porthmos-lfs" }
porthmos-ssh = { path = "porthmos-ssh" }
porthmos-tls = { path = "porthmos-tls" }
porthmos-term = { path = "porthmos-term" }
porthmos-monitor = { path = "porthmos-monitor" }
porthmos-highlight = { path = "porthmos-highlight" }
porthmos-tunnel = { path = "porthmos-tunnel" }
porthmos-update = { path = "porthmos-update" }
porthmos-sftp = { path = "protocols/sftp" }
porthmos-ftp = { path = "protocols/ftp" }
porthmos-webdav = { path = "protocols/webdav" }
porthmos-s3 = { path = "protocols/s3" }
porthmos-scp = { path = "protocols/scp" }
porthmos-core = { path = "porthmos-core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
