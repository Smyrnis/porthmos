name: CI

on:
  push:
    branches: [main, development, compatibility/windows]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p porthmos-core --no-default-features
      - name: Dependency boundaries
        run: |
          forbid_dependency() {
            if cargo tree "${@:3}" -p "$1" -e normal -i "$2" 2>/dev/null | grep -q "^$2 "; then
              echo "$1 must not depend on $2"
              exit 1
            fi
          }
          forbid_workspace_crates() {
            if cargo tree -p "$1" -e normal | grep -qE "$2"; then
              echo "$1 depends on a workspace crate it must not use"
              exit 1
            fi
          }
          forbid_dependency porthmos-core ratatui
          forbid_dependency porthmos-core crossterm
          forbid_dependency porthmos-core russh --no-default-features
          forbid_workspace_crates porthmos-vfs 'porthmos-(core|lfs|tls|ssh|sftp|ftp|webdav|s3|scp|tui)'
          forbid_workspace_crates porthmos-lfs 'porthmos-(core|tls|ssh|sftp|ftp|webdav|s3|scp|tui)'
          forbid_workspace_crates porthmos-tls 'porthmos-(core|lfs|ssh|sftp|ftp|webdav|s3|scp|tui)'
          forbid_workspace_crates porthmos-ssh 'porthmos-(core|lfs|tls|sftp|ftp|webdav|s3|scp|tui)'
          forbid_workspace_crates porthmos-update 'porthmos-(core|vfs|lfs|tls|ssh|sftp|ftp|webdav|s3|scp|tui|release)'
          forbid_workspace_crates porthmos-release 'porthmos-(core|vfs|lfs|tls|ssh|sftp|ftp|webdav|s3|scp|tui)'
          for manifest in protocols/*/Cargo.toml; do
            crate=$(sed -n 's/^name = "\(.*\)"$/\1/p' "$manifest" | head -n 1)
            if [ "$(cargo tree -p "$crate" -e normal | grep -oE 'porthmos-[a-z0-9]+' | sort -u | grep -vxE "$crate|porthmos-vfs|porthmos-tls|porthmos-ssh")" != "" ]; then
              echo "$crate must depend on porthmos-vfs, porthmos-tls and porthmos-ssh only"
              exit 1
            fi
          done
          if [ "$(cargo tree -p porthmos-tui -e normal --depth 1 | grep -c 'porthmos-')" != 2 ]; then
            echo "porthmos-tui must depend on porthmos-core only"
            exit 1
          fi
      - name: Installer
        run: |
          shellcheck scripts/install/*.sh
          bash scripts/install/test.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - name: Long path manifest
        shell: pwsh
        run: |
          cargo build -p porthmos-tui
          if (-not (Select-String -Path target\debug\porthmos.exe -Pattern 'longPathAware' -SimpleMatch -Quiet)) { throw 'the manifest is not embedded' }
      - name: Start OpenSSH Server
        shell: pwsh
        run: |
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          }
          $ssh = Join-Path $env:USERPROFILE '.ssh'
          New-Item -ItemType Directory -Force -Path $ssh | Out-Null
          $key = Join-Path $ssh 'porthmos_test'
          Remove-Item -Force -ErrorAction SilentlyContinue $key, "$key.pub"
          ssh-keygen -q -t ed25519 -N "" -f $key
          New-Item -ItemType Directory -Force -Path 'C:\ProgramData\ssh' | Out-Null
          $authorized = 'C:\ProgramData\ssh\administrators_authorized_keys'
          Get-Content "$key.pub" | Set-Content -Encoding ascii $authorized
          icacls $authorized /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F'
          Set-Service sshd -StartupType Manual
          Start-Service sshd
          "PORTHMOS_TEST_SSHD_PORT=22" >> $env:GITHUB_ENV
          "PORTHMOS_TEST_SSHD_USER=$env:USERNAME" >> $env:GITHUB_ENV
          "PORTHMOS_TEST_SSHD_KEY=$key" >> $env:GITHUB_ENV
      - name: Copy, move, sync and resume against OpenSSH Server
        run: cargo test -p porthmos-core --features sshd-tests --test real_transfers -- --test-threads=1

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - run: cargo test -p porthmos-core --no-default-features
