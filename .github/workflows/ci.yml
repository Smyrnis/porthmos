name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p porthmos-core --no-default-features
      - name: Dependency boundaries
        run: |
          forbid_dependency() {
            if cargo tree "${@:3}" -p "$1" -e normal -i "$2" 2>/dev/null | grep -q "^$2 "; then
              echo "$1 must not depend on $2"
              exit 1
            fi
          }
          forbid_workspace_crates() {
            if cargo tree -p "$1" -e normal | grep -qE "$2"; then
              echo "$1 depends on a workspace crate it must not use"
              exit 1
            fi
          }
          forbid_dependency porthmos-core ratatui
          forbid_dependency porthmos-core crossterm
          forbid_dependency porthmos-core russh --no-default-features
          forbid_workspace_crates porthmos-vfs 'porthmos-(core|lfs|tls|ssh|sftp|ftp|webdav|s3|scp|tui)'
          forbid_workspace_crates porthmos-lfs 'porthmos-(core|tls|ssh|sftp|ftp|webdav|s3|scp|tui)'
          forbid_workspace_crates porthmos-tls 'porthmos-(core|lfs|ssh|sftp|ftp|webdav|s3|scp|tui)'
          forbid_workspace_crates porthmos-ssh 'porthmos-(core|lfs|tls|sftp|ftp|webdav|s3|scp|tui)'
          forbid_workspace_crates porthmos-update 'porthmos-(core|vfs|lfs|tls|ssh|sftp|ftp|webdav|s3|scp|tui|release)'
          forbid_workspace_crates porthmos-release 'porthmos-(core|vfs|lfs|tls|ssh|sftp|ftp|webdav|s3|scp|tui)'
          for manifest in protocols/*/Cargo.toml; do
            crate=$(sed -n 's/^name = "\(.*\)"$/\1/p' "$manifest" | head -n 1)
            if [ "$(cargo tree -p "$crate" -e normal | grep -oE 'porthmos-[a-z0-9]+' | sort -u | grep -vxE "$crate|porthmos-vfs|porthmos-tls|porthmos-ssh")" != "" ]; then
              echo "$crate must depend on porthmos-vfs, porthmos-tls and porthmos-ssh only"
              exit 1
            fi
          done
          if [ "$(cargo tree -p porthmos-tui -e normal --depth 1 | grep -c 'porthmos-')" != 2 ]; then
            echo "porthmos-tui must depend on porthmos-core only"
            exit 1
          fi
      - name: Installer
        run: |
          shellcheck scripts/install/*.sh
          bash scripts/install/test.sh

  # W1 adds porthmos-vfs to the test step; W2 widens this job to the whole workspace.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p porthmos-vfs -p porthmos-update -p porthmos-release --all-targets
      - run: cargo clippy -p porthmos-vfs -p porthmos-update -p porthmos-release --all-targets -- -D warnings
      - run: cargo test -p porthmos-update -p porthmos-release

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - run: cargo test -p porthmos-core --no-default-features
