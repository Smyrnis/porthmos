name: Feature request
description: Suggest something Porthmos should do
labels: ["enhancement"]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options: ["Terminal app", "Window app", "Both"]
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Porthmos help?
