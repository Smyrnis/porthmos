[package]
name = "porthmos-gui"
description = "A dual-panel file manager window for local files and remote connections"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "porthmos-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
iced = { workspace = true, features = ["svg", "tokio"] }
porthmos-core.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
unicode-width.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle.workspace = true
rustix.workspace = true
wayland-backend.workspace = true
wayland-client.workspace = true
x11-dl.workspace = true
x11rb.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
drag.workspace = true
raw-window-handle.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console"] }

[build-dependencies]
embed-manifest.workspace = true
winresource.workspace = true

