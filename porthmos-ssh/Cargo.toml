[package]
name = "porthmos-ssh"
description = "SSH connections shared by the Porthmos protocols that run over SSH"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
testing = ["dep:tempfile", "tokio/process"]

[dependencies]
anyhow.workspace = true
porthmos-vfs.workspace = true
russh.workspace = true
base64 = "0.22"
gethostname = "1.1"
sha1 = "0.10"
tokio = { workspace = true, features = ["net", "process", "io-util"] }
tracing.workspace = true
tempfile = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "process"] }
porthmos-ssh = { path = ".", features = ["testing"] }
